# தமிழ் பதில்கள். எல்லா எண்களும் engine-இலிருந்து மட்டுமே வருகின்றன.
# Tamil wording to be reviewed by a native speaker before the pilot (plan §3.1).

welcome: |-
  Vanakkam! 🙏 I'm Vilai. I tell you which mandi pays the most after transport.
  வணக்கம்! 🙏 நான் விலை. போக்குவரத்து செலவுக்குப் பிறகு எந்த சந்தை அதிகம் தரும் என்று சொல்வேன்.
  Reply 1 for தமிழ் · 2 for English

language_prompt: |-
  மொழியைத் தேர்ந்தெடுக்கவும்: 1 தமிழ் · 2 English

consent: |-
  ஆலோசனை தர உங்கள் தொலைபேசி எண், நிலத்தின் இடம், பயிர்கள் ஆகியவற்றை சேமிக்க வேண்டும். சந்தை ஆலோசனைக்கு மட்டுமே பயன்படுத்துவோம். எப்போது வேண்டுமானாலும் நீக்கச் சொல்லலாம்.
  தொடர YES அல்லது ஆம் என்று அனுப்பவும்.

consent_declined: |-
  சரி, எதையும் சேமிக்கவில்லை. மீண்டும் தொடங்க எப்போது வேண்டுமானாலும் "hi" அனுப்பவும்.

your_location: |-
  உங்கள் இடம்

ask_location: |-
  உங்கள் நிலம் எங்கே உள்ளது? Location 📍 அனுப்பவும் (📎 → Location) அல்லது அருகிலுள்ள ஊரின் பெயரை எழுதவும்.

location_not_understood: |-
  மன்னிக்கவும், அந்த இடம் கிடைக்கவில்லை. Location 📍 அனுப்பவும் அல்லது அருகிலுள்ள ஊரை எழுதவும், எ.கா. திண்டுக்கல்.

ask_crops: |-
  நீங்கள் என்ன பயிர் செய்கிறீர்கள்? இவற்றுக்கு உதவ முடியும்: {{ crop_list }}.

crops_not_understood: |-
  மன்னிக்கவும், பயிர் புரியவில்லை. இவற்றுக்கு உதவ முடியும்: {{ crop_list }}.

onboarded: |-
  சேமிக்கப்பட்டது ✅ பயிர்கள்: {{ crops }}. இடம்: {{ place }}.
  எப்போது வேண்டுமானாலும் கேளுங்கள், எ.கா. "20 குவிண்டால் தக்காளி".

ask_crop: |-
  எந்த பயிரை விற்க வேண்டும்? {{ crop_list }}

ask_quantity: |-
  எவ்வளவு {{ crop }} உள்ளது? எ.கா. "20 குவிண்டால்" அல்லது "500 கிலோ".

unit_not_understood: |-
  மன்னிக்கவும், அந்த அளவைப் பயன்படுத்த முடியவில்லை. குவிண்டால், கிலோ அல்லது டன்னில் அனுப்பவும், எ.கா. "20 குவிண்டால்".

confirm_query: |-
  உறுதி செய்யவும்: {{ crop }}, {{ quantity }}, {{ place }} பகுதியிலிருந்து. சரியா?
  1 ஆம் · 2 மாற்று

change_what: |-
  சரி. பயிர், அளவு, இடம் மூன்றையும் மீண்டும் அனுப்பவும், எ.கா. "20 குவிண்டால் தக்காளி, திண்டுக்கல்".

advice: |-
  {{ crop }} · {{ quantity }} · {{ as_of }} நிலவரப்படி விலை
  {% for o in options %}
  {{ loop.index }}. {{ o.market }} — ₹{{ o.modal }}/குவிண்டால் · {{ o.km }} கி.மீ → உங்களுக்கு ≈ ₹{{ o.net }}/குவிண்டால் (மொத்தம் ≈ ₹{{ o.total }}){% if o.stale %} · பழைய விலை ({{ o.date }}){% endif %}

  {% endfor %}
  {% if glut %}
  ⚠ {{ glut.market }}: வரத்து வழக்கத்தை விட {{ glut.pct }}% அதிகம் — விலை குறையலாம்.
  {% endif %}
  {% if regional_glut %}
  ⚠ அருகிலுள்ள பல சந்தைகளில் வரத்து அதிகம் — விலை குறையலாம்.
  {% endif %}
  {% if extra %}
  {{ best }}, அருகிலுள்ள சந்தையை ({{ nearest }}) விட ≈ ₹{{ extra }} அதிகம் தரும்.
  {% endif %}
  {% if stale %}
  ⓘ கடந்த 3 நாட்களில் அருகிலுள்ள எந்த சந்தையும் விலை தெரிவிக்கவில்லை. போகும் முன் சரிபார்க்கவும்.
  {% endif %}
  {% if unverified %}
  ⓘ இந்த பயிரின் விலைத் தகவல் இன்னும் சரிபார்க்கப்படுகிறது.
  {% endif %}

no_data: |-
  {{ crop }}: கடந்த 2 வாரங்களில் {{ place }} அருகில் எந்த சந்தையும் விலை தெரிவிக்கவில்லை. ஊகித்துச் சொல்ல மாட்டேன். நாளை மீண்டும் முயற்சிக்கவும்.

price: |-
  {{ market }} சந்தையில் {{ crop }}: ₹{{ modal }}/குவிண்டால் (₹{{ low }}–{{ high }}) · {{ date }}

price_no_data: |-
  {{ market }} சந்தையில் {{ crop }}: கடந்த 2 வாரங்களில் விலை தெரிவிக்கப்படவில்லை.

price_which_market: |-
  எந்த சந்தை? எ.கா. "ஒட்டன்சத்திரம் {{ crop }} விலை".

help: |-
  இவற்றுக்கு உதவ முடியும்:
  • எங்கே விற்கலாம்: "20 குவிண்டால் தக்காளி"
  • ஒரு சந்தையின் விலை: "ஒட்டன்சத்திரம் தக்காளி விலை"
  • "பயிர் மாற்று" · "இடம் மாற்று" · "மொழி"

alerts_coming_soon: |-
  தினசரி விலை அறிவிப்புகள் விரைவில் வரும்.

audio_coming_soon: |-
  குரல் செய்திகள் விரைவில் வரும். இப்போதைக்கு உங்கள் கேள்வியை எழுதி அனுப்பவும்.

unknown: |-
  மன்னிக்கவும், புரியவில்லை. "20 குவிண்டால் தக்காளி" என்று அனுப்பவும் அல்லது "உதவி" என்று அனுப்பவும்.

disclaimer: |-
  ⓘ விலைகள் அரசு சந்தை அறிக்கைகளிலிருந்து (Agmarknet) எடுக்கப்பட்டவை, மாறலாம். இது ஒரு வழிகாட்டி மட்டுமே, உத்தரவாதம் அல்ல.

error: |-
  மன்னிக்கவும், எங்கள் பக்கம் ஒரு பிழை ஏற்பட்டது. சில நிமிடங்களில் மீண்டும் முயற்சிக்கவும்.
