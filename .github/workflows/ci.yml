name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vilai
          POSTGRES_PASSWORD: vilai
          POSTGRES_DB: vilai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vilai"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy app
      - name: Tests on Postgres
        env:
          TEST_DATABASE_URL: postgresql+psycopg://vilai:vilai@localhost:5432/vilai_test
        run: uv run pytest --cov=app --cov-report=term-missing
      - name: Tests on SQLite
        run: uv run pytest
