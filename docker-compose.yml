services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vilai
      POSTGRES_PASSWORD: vilai
      POSTGRES_DB: vilai
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vilai"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://vilai:vilai@db:5432/vilai
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
